<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETI Patagonia</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ===== SECCIÓN PRINCIPAL ===== */

    .main-section {
      flex: 1;
      display: flex;
      align-items: center;
    }

    /* ===== IMAGEN FIJA IZQUIERDA ===== */

    .left-fixed-img {
      height: 320px;            /* MISMA ALTURA VISUAL QUE EL CARRUSEL */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .left-fixed-img img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    /* ===== TITULO ===== */

    .repos-title {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 1.1rem;
    }

    /* ===== CARRUSEL ===== */

    .repo-carousel-wrapper {
      position: relative;
      width: 100%;
    }

    .repo-carousel {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 10px 0;
      scrollbar-width: none;
    }

    .repo-carousel::-webkit-scrollbar {
      display: none;
    }

    .repo-card {
      min-width: 240px;
      height: 320px;
      border: 2px solid #3f46ff;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .repo-card h6 {
      padding: 6px;
      margin: 0;
      background: #f2f2f2;
      font-weight: bold;
      text-align: center;
      font-size: 0.9rem;
    }

    .repo-card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
    }

    .repo-card .repo-body {
      padding: 6px;
      font-size: 0.8rem;
      flex-grow: 1;
      overflow: hidden;
    }

    .repo-card a {
      text-align: center;
      padding: 6px;
      background: #212529;
      color: #fff;
      text-decoration: none;
      font-size: 0.8rem;
    }

    /* ===== FLECHAS ===== */

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #212529;
      color: #fff;
      border: none;
      width: 34px;
      height: 34px;
      font-size: 22px;
      cursor: pointer;
      z-index: 10;
      opacity: 0.85;
    }

    .carousel-btn.left { left: -16px; }
    .carousel-btn.right { right: -16px; }

    /* ===== LOGO INFERIOR ===== */

    .bottom-logo img {
      max-height: 180px;
      width: auto;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <img src="img/logo2.png" height="40" class="me-2">

    <a class="navbar-brand" href="#">ETI Patagonia</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="https://github.com/ETI-PATAGONIA-AR/ETI-Patagonia---Quienes-SOMOS--">Quiénes Somos</a></li>
        <li class="nav-item"><a class="nav-link" href="https://github.com/ETI-PATAGONIA-AR">Repositorios</a></li>
        <li class="nav-item"><a class="nav-link" href="https://github.com/ETI-PATAGONIA-AR/Contacto">Contacto</a></li>
      </ul>
    </div>

  </div>
</nav>

<section class="container main-section" id="repos">

  <div class="row align-items-center w-100">

    <div class="col-md-3 left-fixed-img">
      <img src="img/ETI_Patagonia.png" alt="ETI Patagonia">
    </div>

    <div class="col-md-9">

      <div class="repos-title">Últimos repositorios</div>

      <div class="repo-carousel-wrapper">
        <button class="carousel-btn left" onclick="scrollRepos(-1)">‹</button>

        <div class="repo-carousel" id="repoCarousel"></div>

        <button class="carousel-btn right" onclick="scrollRepos(1)">›</button>
      </div>

    </div>

  </div>

</section>

<section class="container text-center bottom-logo my-2">
  <img src="img/prof_martintorres.png" class="img-fluid">
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>
fetch("https://api.github.com/users/ETI-PATAGONIA-AR/repos")
  .then(r => r.json())
  .then(repos => {
    const c = document.getElementById("repoCarousel");
    repos
      .filter(r => !r.fork)
      .sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))
      .forEach(repo => {
        c.innerHTML += `
          <div class="repo-card">
            <h6>${repo.name}</h6>
            <img src="https://opengraph.githubassets.com/1/${repo.full_name}">
            <div class="repo-body">${repo.description ?? "Sin descripción"}</div>
            <a href="${repo.html_url}" target="_blank">Seguir leyendo →</a>
          </div>
        `;
      });
  });

function scrollRepos(dir) {
  document.getElementById("repoCarousel")
    .scrollBy({ left: dir * 300, behavior: "smooth" });
}
</script>

</body>
</html>
