<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uPLC-Web — Editor de Bloques | ETI Patagonia</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;background:#f0f4ff}

  .navbar{background:#0b1a33!important;padding:.4rem 0}
  .navbar-brand{font-weight:700;color:#fff!important;font-size:.95rem}
  .navbar-brand img{height:28px}

  #toolbar{display:flex;align-items:center;gap:6px;padding:5px 12px;background:#1a3a6b;min-height:40px;flex-wrap:wrap}
  #toolbar button{padding:5px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;color:white;white-space:nowrap}
  #btn-new{background:#E74C3C}#btn-open{background:#27AE60}
  #btn-gen{background:#8E44AD;font-size:13px}#btn-clear{background:#7F8C8D}
  #btn-examples{background:#E67E22}
  #btn-connect{background:#1ABC9C}
  #btn-upload{background:#2980B9;font-size:13px}
  #btn-refresh{background:#5D6D7E}
  #btn-back{background:#5D6D7E}
  #examplesModal .modal-body{max-height:60vh;overflow-y:auto}
  #examplesModal .list-group-item{cursor:pointer;padding:8px 12px;font-size:13px}
  #examplesModal .list-group-item:hover{background:#f0f4ff}
  #examplesModal .list-group-item small{color:#6c757d}
  #toolbar span{color:white;font-weight:bold;font-size:14px;margin-right:6px}
  select.board-select{padding:4px 8px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer}
  input[type=file]{display:none}

  #main{display:flex;flex:1;overflow:hidden}
  #blocklyArea{flex:1;position:relative}
  #blocklyDiv{position:absolute;top:0;left:0;right:0;bottom:0}
  #codePanel{width:340px;display:flex;flex-direction:column;background:#1e1e1e;border-left:2px solid #3498DB}
  #codePanelTitle{background:#2980B9;color:white;padding:6px 10px;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:space-between}
  #codePanelTitle button{background:rgba(255,255,255,.2);border:none;color:white;padding:2px 8px;border-radius:4px;font-size:11px;cursor:pointer}
  #codePreview{flex:1;overflow:auto;padding:8px;color:#d4d4d4;font-family:'Courier New',monospace;font-size:11px;white-space:pre;line-height:1.5}
  #statusBar{background:#2C3E50;color:#ecf0f1;padding:3px 10px;font-size:11px;display:flex;justify-content:space-between}
  .blocklyMainBackground{fill:#f8faff!important}

  @media(max-width:768px){
    #codePanel{display:none}
    #toolbar{padding:4px 8px}
    #toolbar span{font-size:12px}
  }
</style>
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container-fluid px-3">
    <a class="navbar-brand d-flex align-items-center gap-2" href="app.html">
      <img src="img/ETI1.png" alt="ETI"> uPLC-Web — Editor de Bloques
    </a>
    <a href="app.html" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left me-1"></i>Volver</a>
  </div>
</nav>

<div id="toolbar">
  <span>🎮 uPLC-Web</span>
  <button id="btn-back" onclick="location.href='app.html'"><i class="bi bi-arrow-left"></i> Volver</button>
  <button id="btn-new">📄 Nuevo</button>
  <button id="btn-open">📂 Abrir</button>
  <button id="btn-examples">📚 Ejemplos</button>
  <button id="btn-gen">⚡ Generar .ino</button>
  <button id="btn-clear">🗑 Limpiar</button>
  <select class="board-select" id="boardSelect">
    <option value="uno">Arduino UNO</option>
    <option value="nano">Arduino NANO</option>
    <option value="nano_old">NANO (bootloader viejo)</option>
  </select>
  <select class="board-select" id="portSelect" style="min-width:100px">
    <option value="">-- Puerto --</option>
  </select>
  <button id="btn-refresh" title="Buscar puertos">🔄</button>
  <button id="btn-connect" title="Conectar al bridge">🔌 Bridge</button>
  <button id="btn-upload" disabled>📤 Subir al Arduino</button>
  <input type="file" id="fileInput" accept=".uplcj,.xml">
</div>

<div id="main">
  <div id="blocklyArea"><div id="blocklyDiv"></div></div>
  <div id="codePanel">
    <div id="codePanelTitle">
      <span>📋 Vista previa del sketch Arduino</span>
      <button onclick="copyCode()"><i class="bi bi-clipboard me-1"></i>Copiar</button>
    </div>
    <pre id="codePreview">// El código aparecerá aquí
// mientras construís el programa</pre>
  </div>
</div>

<div id="statusBar">
  <span id="statusMsg">Cargando editor...</span>
  <span>uPLC-Web v1.0 — ETI Patagonia</span>
</div>

<div class="modal fade" id="examplesModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header" style="background:#E67E22;color:white">
        <h5 class="modal-title"><i class="bi bi-book me-2"></i>Ejemplos uPLC-Web</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-bold">Seleccioná la versión de la placa:</label>
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="boardVersion" id="v1Radio" value="v1" checked>
            <label class="btn btn-outline-primary" for="v1Radio">PlacaV1</label>
            <input type="radio" class="btn-check" name="boardVersion" id="v2Radio" value="v2">
            <label class="btn btn-outline-primary" for="v2Radio">PlacaV2</label>
          </div>
        </div>
        <div id="examplesList" class="list-group"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
<script src="https://unpkg.com/blockly@10.4.3/msg/es.js"></script>
<script>
'use strict';

const gs = {
  lcd:false,servo:false,sserial:false,ultrasonic:false,
  buzzer:false,l298:false,serial:false,game:false,face:false,bt:false,
  timers:new Set(),counters:new Set(),vars:new Set(),
  mems:new Set(),sprites:new Set(),
  dout:new Set(),din:new Map(),pwm:new Set(),
  reset(){
    this.lcd=this.servo=this.sserial=this.ultrasonic=false;
    this.buzzer=this.l298=this.serial=this.game=this.face=this.bt=false;
    this.timers.clear();this.counters.clear();this.vars.clear();
    this.mems.clear();this.sprites.clear();
    this.dout.clear();this.din.clear();this.pwm.clear();
  }
};

Blockly.defineBlocksWithJsonArray([

const Arduino = new Blockly.Generator('Arduino');
Arduino.ORDER_ATOMIC=0;Arduino.ORDER_UNARY=2;Arduino.ORDER_MULT=3;Arduino.ORDER_ADDITIVE=4;
Arduino.ORDER_RELATIONAL=6;Arduino.ORDER_EQUALITY=7;Arduino.ORDER_LOGICAL_AND=11;Arduino.ORDER_LOGICAL_OR=12;Arduino.ORDER_NONE=99;
Arduino.INDENT='';
Arduino.scrub_=function(block,code,thisOnly){const next=block.nextConnection&&block.nextConnection.targetBlock();return thisOnly?code:code+(next?Arduino.blockToCode(next):'');};

function ind(code){return code.split('\n').filter(l=>l.trim()).map(l=>'  '+l).join('\n')+'\n';}
function v(block,n,o){return Arduino.valueToCode(block,n,o||Arduino.ORDER_ATOMIC)||'0';}
function vs(block,n){return Arduino.valueToCode(block,n,Arduino.ORDER_NONE)||'"?"';}
function st(block,n){return Arduino.statementToCode(block,n)||'';}
function f(block,n){const r=block.getFieldValue(n);return(r!==null&&r!==undefined)?String(r):'';}
function ff(block,n,def){const r=f(block,n);return(r===''||r===null)?String(def):r;}
function block_getNum(b,n){const r=b.getFieldValue(n);return(r!==null&&r!==undefined)?String(r):'0';}

function generateSketch(){
  gs.reset();
  const tops=workspace.getTopBlocks(true);
  let setupCode='',loopCode='';
  const funcs=[];
  for(const b of tops){
    if(b.type==='blk_al_iniciar')setupCode=Arduino.statementToCode(b,'BODY')||'';
    else if(b.type==='blk_para_siempre')loopCode=Arduino.statementToCode(b,'BODY')||'';
    else if(b.type==='blk_funcion_def'){const nm=(b.getFieldValue('NAME')||'miCodigo').replace(/\W/g,'_');funcs.push({name:nm,code:Arduino.statementToCode(b,'BODY')||''});}
  }
  return buildSketch(setupCode,loopCode,funcs);
}

  if(gs.pwm.size){L.push('  // Pines PWM');for(const p of[...gs.pwm].sort((a,b)=>+a-+b)){if(!gs.dout.has(p))L.push(`  pinMode(${p}, OUTPUT);`);}}

  L.push('}');
  L.push('');
  L.push('void loop() {');
  if(gs.sserial){L.push('  if(_ssoft.available()>0){ String d=_ssoft.readStringUntil(\'\\n\'); _radioVal=d.toInt(); }');}
  if(gs.bt){L.push('  _bt_newData = false;');L.push('  if (_btSoft.available() > 0) {');L.push('    String _btLine = _btSoft.readStringUntil(\'\\n\');');L.push('    _btLine.trim();');L.push('    int _c = _btLine.indexOf(\':\');');L.push('    if (_c > 0) {');L.push('      _bt_rxId  = _btLine.substring(0, _c);');L.push('      _bt_rxVal = _btLine.substring(_c + 1).toInt();');L.push('      _bt_newData = true;');L.push('      if      (_bt_rxId=="D2")  _bt_D2  = _bt_rxVal;');L.push('      else if (_bt_rxId=="D3")  _bt_D3  = _bt_rxVal;');L.push('      else if (_bt_rxId=="D4")  _bt_D4  = _bt_rxVal;');L.push('      else if (_bt_rxId=="D5")  _bt_D5  = _bt_rxVal;');L.push('      else if (_bt_rxId=="D6")  _bt_D6  = _bt_rxVal;');L.push('      else if (_bt_rxId=="D7")  _bt_D7  = _bt_rxVal;');L.push('      else if (_bt_rxId=="D8")  _bt_D8  = _bt_rxVal;');L.push('      else if (_bt_rxId=="D9")  _bt_D9  = _bt_rxVal;');L.push('      else if (_bt_rxId=="D10") _bt_D10 = _bt_rxVal;');L.push('      else if (_bt_rxId=="D11") _bt_D11 = _bt_rxVal;');L.push('      else if (_bt_rxId=="D12") _bt_D12 = _bt_rxVal;');L.push('      else if (_bt_rxId=="D13") _bt_D13 = _bt_rxVal;');L.push('      else if (_bt_rxId=="A0")  _bt_A0  = _bt_rxVal;');L.push('      else if (_bt_rxId=="A1")  _bt_A1  = _bt_rxVal;');L.push('      else if (_bt_rxId=="A2")  _bt_A2  = _bt_rxVal;');L.push('      else if (_bt_rxId=="A3")  _bt_A3  = _bt_rxVal;');L.push('      else if (_bt_rxId=="P3")  _bt_P3  = _bt_rxVal;');L.push('      else if (_bt_rxId=="P5")  _bt_P5  = _bt_rxVal;');L.push('      else if (_bt_rxId=="P6")  _bt_P6  = _bt_rxVal;');L.push('      else if (_bt_rxId=="P9")  _bt_P9  = _bt_rxVal;');L.push('      else if (_bt_rxId=="P10") _bt_P10 = _bt_rxVal;');L.push('      else if (_bt_rxId=="P11") _bt_P11 = _bt_rxVal;');L.push('    }');L.push('  }');}
  if(gs.face&&gs.lcd){L.push('  { unsigned long _nf=millis();');L.push('    if(!_is_blinking && (_nf-_blink_timer>=4000UL)){ _is_blinking=true;  _blink_timer=_nf;      drawFace(); }');L.push('    else if(_is_blinking && (_nf-_blink_timer>=200UL)){ _is_blinking=false; _blink_timer=millis(); drawFace(); }');L.push('    if(_face_state!=_prev_face){ _prev_face=_face_state; drawFace(); } }');}
  if(loopCode.trim()){L.push('  // — Para siempre —');for(const ln of loopCode.split('\n'))if(ln.trim())L.push('  '+ln);}
  L.push('  delay(10);');
  L.push('}');
  for(const fn of funcs){L.push('');L.push(`void ${fn.name}() {`);for(const ln of(fn.code||'').split('\n'))if(ln.trim())L.push('  '+ln);L.push('}');}
  L.push('');
  return L.join('\n');
}

function getCode(){return generateSketch();}
function getXML(){const dom=Blockly.Xml.workspaceToDom(workspace);return Blockly.Xml.domToText(dom);}

function loadXML(xmlText){try{workspace.clear();const dom=Blockly.utils.xml.textToDom(xmlText);Blockly.Xml.domToWorkspace(dom,workspace);updatePreview();}catch(e){console.error('loadXML error:',e);}}
function clearWorkspace(){workspace.clear();updatePreview();}

let _previewTimeout=null;
function updatePreview(){clearTimeout(_previewTimeout);_previewTimeout=setTimeout(()=>{try{const code=generateSketch();document.getElementById('codePreview').textContent=code;}catch(e){document.getElementById('codePreview').textContent='// Error generando código:\n// '+e.message;}},300);}

function setStatus(msg){document.getElementById('statusMsg').textContent=msg;}

function copyCode(){
  const code=document.getElementById('codePreview').textContent;
  navigator.clipboard.writeText(code).then(()=>{setStatus('Código copiado al portapapeles');setTimeout(()=>setStatus('Listo'),2000);});
}

function renderExamples() {
  const ver = document.querySelector('input[name="boardVersion"]:checked').value;
  const list = document.getElementById('examplesList');
  const items = EXAMPLES[ver] || [];
  list.innerHTML = items.map(ex =>
    `<button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" data-name="${ex.name}">
      <div><strong>${ex.title}</strong><br><small>${ex.desc}</small></div>
      <i class="bi bi-chevron-right"></i>
    </button>`
  ).join('');
  list.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => loadExample(ver, btn.dataset.name);
  });
}

async function loadExample(version, name) {
  try {
    const resp = await fetch(`ejemplos/${version}/${name}.uplcj`);
    if (!resp.ok) throw new Error('No se pudo cargar el ejemplo');
    const text = await resp.text();
    const data = JSON.parse(text);
    loadXML(data.blockly_xml || data);
    bootstrap.Modal.getInstance(document.getElementById('examplesModal')).hide();
    setStatus('Ejemplo cargado: ' + name);
  } catch (e) {
    alert('Error al cargar ejemplo: ' + e.message);
  }
}

document.getElementById('btn-examples').onclick = () => {
  renderExamples();
  new bootstrap.Modal(document.getElementById('examplesModal')).show();
};
document.querySelectorAll('input[name="boardVersion"]').forEach(r => r.onchange = renderExamples);

let bridgeWs = null;
let bridgeConnected = false;

function processBridgeMessage(msg) {
  if (msg.type === 'boards') {
    const sel = document.getElementById('portSelect');
    sel.innerHTML = '<option value="">-- Puerto --</option>';
    if (msg.boards && msg.boards.length) {
      msg.boards.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.port;
        opt.textContent = `${b.port} — ${b.protocolLabel || 'Serial'}`;
        sel.appendChild(opt);
      });
      setStatus(`${msg.boards.length} placa(s) detectada(s)`);
    } else {
      setStatus('No se detectaron placas. Conectá una por USB.');
    }
  }
  if (msg.type === 'status') {
    setStatus(msg.message);
  }
  if (msg.type === 'result') {
    if (msg.success) {
      setStatus('✅ ¡Upload completado!');
      alert('¡Sketch subido al Arduino correctamente!');
    } else {
      const where = msg.step === 'compile' ? 'COMPILACIÓN' : 'UPLOAD';
      setStatus(`❌ Error en ${where}`);
      alert(`Error en ${where}:\n\n${msg.error}`);
    }
    document.getElementById('btn-upload').disabled = false;
    document.getElementById('btn-upload').textContent = '📤 Subir al Arduino';
  }
}
function connectBridge() {
  if (bridgeWs && bridgeWs.readyState === WebSocket.OPEN) {
    bridgeWs.close();
    return;
  }
  setStatus('Conectando al bridge...');
  let wasOpen = false;
  let tryingAutoStart = false;
  bridgeWs = new WebSocket('ws://localhost:8765');

  bridgeWs.onopen = () => {
    wasOpen = true;
    bridgeConnected = true;
    document.getElementById('btn-connect').textContent = '🔌 Desconectar';
    document.getElementById('btn-connect').style.background = '#E74C3C';
    document.getElementById('btn-upload').disabled = false;
    setStatus('Bridge conectado — listo para compilar y subir');
    refreshPorts();
  };

  bridgeWs.onmessage = (evt) => { processBridgeMessage(JSON.parse(evt.data)); };

  bridgeWs.onclose = () => {
    if (wasOpen) {
      bridgeConnected = false;
      document.getElementById('btn-connect').textContent = '🔌 Bridge';
      document.getElementById('btn-connect').style.background = '#1ABC9C';
      document.getElementById('btn-upload').disabled = true;
      document.getElementById('portSelect').innerHTML = '<option value="">-- Puerto --</option>';
      setStatus('Bridge desconectado');
      return;
    }
    if (tryingAutoStart) return;
    tryingAutoStart = true;
    setStatus('Bridge no encontrado, intentando iniciar...');
    try { window.location.href = 'uplc-bridge://start'; } catch(e) {}
    let retries = 0;
    const maxRetries = 8;
    const retryInterval = setInterval(() => {
      retries++;
      if (bridgeConnected) { clearInterval(retryInterval); return; }
      if (retries >= maxRetries) {
        clearInterval(retryInterval);
        tryingAutoStart = false;
        alert('No se pudo iniciar uPLC-Bridge.\n\nEjecutá iniciar.bat manualmente.');
        return;
      }
      setStatus(`Reintentando... (${retries}/${maxRetries})`);
      try {
        const test = new WebSocket('ws://localhost:8765');
        test.onopen = () => {
          clearInterval(retryInterval);
          try { test.close(); } catch(e) {}
          connectBridge();
        };
        test.onerror = () => {};
      } catch(e) {}
    }, 2000);
  };

  bridgeWs.onerror = () => {};
}

window.FQBN_MAP = {
  uno: 'arduino:avr:uno',
  nano: 'arduino:avr:nano',
  nano_old: 'arduino:avr:nano:cpu=atmega328old'
};

function refreshPorts() {
  if (bridgeWs && bridgeWs.readyState === WebSocket.OPEN) {
    bridgeWs.send(JSON.stringify({ type: 'list' }));
    setStatus('Buscando placas...');
  }
}

function uploadToArduino() {
  if (!bridgeWs || bridgeWs.readyState !== WebSocket.OPEN) {
    alert('No hay conexión con el bridge.');
    return;
  }
  const port = document.getElementById('portSelect').value;
  if (!port) {
    alert('Seleccioná un puerto.');
    return;
  }
  const boardKey = document.getElementById('boardSelect').value;
  const fqbnMap = { uno: 'arduino:avr:uno', nano: 'arduino:avr:nano', nano_old: 'arduino:avr:nano:cpu=atmega328old' };
  const fqbn = fqbnMap[boardKey] || 'arduino:avr:uno';
  const code = generateSketch();

  console.log('[uPLC] boardKey:', boardKey, 'fqbn:', fqbn, 'port:', port);

  document.getElementById('btn-upload').disabled = true;
  document.getElementById('btn-upload').textContent = '⏳ Compilando y subiendo...';
  setStatus('Compilando...');

  bridgeWs.send(JSON.stringify({ type: 'upload', code, fqbn, port }));
}

document.getElementById('btn-connect').onclick = connectBridge;
document.getElementById('btn-refresh').onclick = refreshPorts;
document.getElementById('btn-upload').onclick = uploadToArduino;
