<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETI Patagonia — Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fc; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; }
    .auth-card { background: #fff; border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,.08); padding: 2.5rem; max-width: 420px; width: 100%; margin: 0 auto; }
    .auth-card .logo { max-height: 60px; margin-bottom: 1rem; }
    .auth-card h4 { font-weight: 700; color: #0b1a33; }
    .auth-card .form-control { border-radius: 10px; padding: .65rem 1rem; font-size: .9rem; border: 1px solid #e2e8f0; }
    .auth-card .form-control:focus { border-color: #0b1a33; box-shadow: 0 0 0 3px rgba(11,26,51,.1); }
    .auth-card .btn-dark { border-radius: 10px; padding: .65rem; font-weight: 600; }
    .auth-card .divider { display: flex; align-items: center; gap: 12px; color: #b0bcc8; font-size: .8rem; margin: 1rem 0; }
    .auth-card .divider::before, .auth-card .divider::after { content: ''; flex: 1; border-top: 1px solid #e2e8f0; }
    .alert-msg { font-size: .82rem; display: none; }
    .password-toggle { cursor: pointer; }
    .status-badge { font-size: .75rem; padding: 4px 10px; border-radius: 6px; background: #eef2f7; color: #7a8a9a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">

        <div class="auth-card text-center">
          <img src="img/logo2.png" class="logo" alt="ETI">

          <!-- Login form -->
          <div id="loginView">
            <h4 class="mb-1">Bienvenido</h4>
            <p class="text-muted small mb-3">Iniciá sesión para acceder al contenido</p>
            <div class="alert alert-danger alert-msg" id="loginError"></div>
            <div class="mb-3 text-start">
              <label class="form-label small fw-semibold text-secondary">Email</label>
              <input type="email" class="form-control" id="loginEmail" placeholder="tu@email.com" autocomplete="email">
            </div>
            <div class="mb-3 text-start">
              <label class="form-label small fw-semibold text-secondary">Contraseña</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-dark w-100 mb-2" onclick="handleLogin()">
              <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
            </button>
            <p class="small text-muted mt-2 mb-0">
              ¿No tenés cuenta?
              <a href="#" onclick="event.preventDefault();showRegister()">Registrate</a>
            </p>
          </div>

          <!-- Register form -->
          <div id="registerView" style="display:none">
            <h4 class="mb-1">Crear Cuenta</h4>
            <p class="text-muted small mb-3">Registrate para acceder al contenido</p>
            <div class="alert alert-danger alert-msg" id="regError"></div>
            <div class="mb-3 text-start">
              <label class="form-label small fw-semibold text-secondary">Nombre completo</label>
              <input type="text" class="form-control" id="regName" placeholder="Tu nombre">
            </div>
            <div class="mb-3 text-start">
              <label class="form-label small fw-semibold text-secondary">Email</label>
              <input type="email" class="form-control" id="regEmail" placeholder="tu@email.com">
            </div>
            <div class="mb-3 text-start">
              <label class="form-label small fw-semibold text-secondary">Contraseña (mín. 6 caracteres)</label>
              <input type="password" class="form-control" id="regPassword" placeholder="••••••••">
            </div>
            <div class="mb-3 text-start">
              <label class="form-label small fw-semibold text-secondary">Confirmar contraseña</label>
              <input type="password" class="form-control" id="regPassword2" placeholder="••••••••">
            </div>
            <button class="btn btn-dark w-100 mb-2" onclick="handleRegister()">
              <i class="bi bi-person-plus me-1"></i> Crear Cuenta
            </button>
            <p class="small text-muted mt-2 mb-0">
              ¿Ya tenés cuenta?
              <a href="#" onclick="event.preventDefault();showLogin()">Iniciar sesión</a>
            </p>
          </div>

          <div class="mt-3">
            <span class="status-badge" id="connStatus"><i class="bi bi-cloud me-1"></i> Verificando...</span>
          </div>
        </div>

        <p class="text-center small text-muted mt-3">
          <a href="index.html" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Volver al inicio</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  // ⚠️ CAMBIAR ESTOS VALORES por los de tu proyecto Supabase
  // Podés obtenerlos en: Settings > API
  const SUPABASE_URL = 'https://gsppzvpgdgapotsrrksk.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzcHB6dnBnZGdhcG90c3Jya3NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNTE2OTksImV4cCI6MjA5ODkyNzY5OX0.R6BvlqytSNa33DfaI3k3uL4gdHmqxiZlrApzoaCRZgA';

  let supabase = null;

  function initSupabase() {
    if (typeof supabaseClient !== 'undefined') {
      supabase = supabaseClient;
      return;
    }
    if (typeof supabase === 'undefined' || !supabase) {
      try {
        const { createClient } = supabaseJs || supabase;
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        console.warn('Supabase SDK no disponible, modo mock');
        supabase = null;
      }
    }
  }

  // Intentar varios paths del SDK
  let supabaseClient = null;
  try {
    const { createClient } = window.supabase || {};
    if (createClient) {
      supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch(e) {}

  if (!supabaseClient) {
    try {
      supabaseClient = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e) {}
  }

  if (!supabaseClient) {
    // Fallback: esperar a que cargue el script
    document.addEventListener('DOMContentLoaded', () => {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch(e) {
        document.getElementById('connStatus').innerHTML = '<i class="bi bi-exclamation-triangle me-1"></i> Error de conexión';
      }
    });
  }

  function showError(el, msg) {
    el.textContent = msg;
    el.style.display = 'block';
  }

  function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const err = document.getElementById('loginError');
    err.style.display = 'none';
    if (!email || !password) { showError(err, 'Completá todos los campos.'); return; }
    if (!supabaseClient) { showError(err, 'Supabase no está configurado. Revisá las credenciales.'); return; }

    supabaseClient.auth.signInWithPassword({ email, password })
      .then(({ data, error }) => {
        if (error) { showError(err, error.message); return; }
        window.location.href = 'app.html';
      });
  }

  function handleRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPassword').value;
    const pass2 = document.getElementById('regPassword2').value;
    const err = document.getElementById('regError');
    err.style.display = 'none';
    if (!name || !email || !pass || !pass2) { showError(err, 'Completá todos los campos.'); return; }
    if (pass.length < 6) { showError(err, 'La contraseña debe tener al menos 6 caracteres.'); return; }
    if (pass !== pass2) { showError(err, 'Las contraseñas no coinciden.'); return; }
    if (!supabaseClient) { showError(err, 'Supabase no está configurado.'); return; }

    supabaseClient.auth.signUp({
      email,
      password,
      options: { data: { full_name: name } }
    }).then(({ data, error }) => {
      if (error) { showError(err, error.message); return; }
      document.getElementById('regError').className = 'alert alert-success alert-msg';
      showError(err, 'Cuenta creada. Revisá tu email para confirmar (si no llega, revisá spam).');
      setTimeout(() => { showLogin(); }, 3000);
    });
  }

  function showRegister() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('registerView').style.display = 'block';
    document.getElementById('regError').style.display = 'none';
    document.getElementById('regError').className = 'alert alert-danger alert-msg';
  }

  function showLogin() {
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('registerView').style.display = 'none';
    document.getElementById('loginError').style.display = 'none';
  }

  // Check if already logged in
  document.addEventListener('DOMContentLoaded', () => {
    if (supabaseClient) {
      supabaseClient.auth.getSession().then(({ data }) => {
        if (data.session) {
          window.location.href = 'app.html';
        }
        document.getElementById('connStatus').innerHTML = '<i class="bi bi-cloud-check me-1"></i> Conectado';
      }).catch(() => {
        document.getElementById('connStatus').innerHTML = '<i class="bi bi-cloud-slash me-1"></i> Sin conexión';
      });
    }
  });
  </script>
</body>
</html>
