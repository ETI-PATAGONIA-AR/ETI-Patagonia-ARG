<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETI Patagonia — Contenidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
  <style>
    :root { --eti-dark: #0b1a33; --eti-light: #f8f9fc; --eti-accent: #8ab4f8; }
    body { font-family: system-ui, sans-serif; background: var(--eti-light); }
    .navbar { background: var(--eti-dark) !important; }
    .content-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.05); padding: 1.2rem; transition: transform .2s, box-shadow .2s; cursor: pointer; border: 1px solid #e6edf4; height: 100%; }
    .content-card:hover { transform: translateY(-3px); box-shadow: 0 6px 24px rgba(0,0,0,.1); }
    .content-card .card-section { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--eti-accent); margin-bottom: .3rem; }
    .content-card h5 { font-size: 1rem; font-weight: 700; color: var(--eti-dark); margin-bottom: .4rem; }
    .content-card p { font-size: .82rem; color: #5a6a7a; margin-bottom: .5rem; }
    .content-card .card-meta { font-size: .72rem; color: #8a9aaa; }
    .content-card .card-tags .badge { background: #eef2f7; color: #4a5a6a; font-weight: 500; }
    .section-nav-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 20px; border: 1px solid #d0d8e4; background: #fff; font-size: .8rem; font-weight: 500; color: #4a5a6a; cursor: pointer; transition: all .2s; }
    .section-nav-btn:hover { border-color: var(--eti-dark); color: var(--eti-dark); }
    .section-nav-btn.active { background: var(--eti-dark); color: #fff; border-color: var(--eti-dark); }
    .viewer-content { line-height: 1.8; font-size: .95rem; }
    .viewer-content h1 { font-size: 1.6rem; font-weight: 700; margin: 1em 0 .5em; }
    .viewer-content h2 { font-size: 1.3rem; font-weight: 700; margin: .8em 0 .4em; }
    .viewer-content img { max-width: 100%; border-radius: 8px; margin: 1em 0; }
    .viewer-content pre { background: #1e2a3a; color: #e4eaf0; padding: 16px; border-radius: 10px; overflow-x: auto; font-size: .82rem; }
    .viewer-content pre code { background: none; color: inherit; padding: 0; }
    .viewer-content code { background: #eef2f7; color: #c7254e; padding: 2px 6px; border-radius: 4px; font-size: .85em; }
    .viewer-content blockquote { border-left: 4px solid var(--eti-dark); padding: 8px 16px; margin: 1em 0; background: #f5f7fa; border-radius: 0 8px 8px 0; font-style: italic; }
    .eti-code-block { position: relative; margin: 1em 0; border-radius: 10px; overflow: hidden; background: #1e2a3a; }
    .eti-code-block .code-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; background: #151f2b; color: rgba(255,255,255,.5); font-size: .7rem; font-weight: 600; }
    .eti-code-block .code-header .copy-btn { background: rgba(255,255,255,.1); border: none; color: rgba(255,255,255,.6); padding: 3px 12px; border-radius: 4px; font-size: .7rem; cursor: pointer; }
    .eti-code-block .code-header .copy-btn:hover { background: rgba(255,255,255,.2); color: #fff; }
    .eti-code-block pre { margin: 0; border-radius: 0; padding: 14px 16px; max-height: 420px; overflow-y: auto; }
    .img-wrap { margin: 1em 0; line-height: 0; }
    .img-wrap.align-left { text-align: left; }
    .img-wrap.align-center { text-align: center; }
    .img-wrap.align-right { text-align: right; }
    .img-wrap img { max-width: 100%; height: auto; border-radius: 8px; display: inline-block; }
    .img-wrap .img-caption { display: block; font-size: .8rem; color: #7a8a9a; line-height: 1.4; margin-top: 6px; font-style: italic; text-align: center; }
    .eti-video-wrap { position: relative; width: 100%; max-width: 720px; margin: 1.5em auto; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; box-shadow: 0 4px 24px rgba(0,0,0,.15); }
    .eti-video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .question-card { background: #fff; border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: .6rem; border: 1px solid #e6edf4; cursor: pointer; transition: box-shadow .2s; }
    .question-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .question-card .q-title { font-weight: 600; color: var(--eti-dark); }
    .answer-card { background: #f5f7fa; border-radius: 10px; padding: .8rem 1rem; margin: .5rem 0 .5rem 1.5rem; border-left: 3px solid var(--eti-dark); }
    .badge-resolved { background: #d4edda; color: #155724; font-size: .65rem; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #9aaaba; }
    .empty-state i { font-size: 3rem; display: block; margin-bottom: .8rem; opacity: .4; }
    .page-title { font-weight: 700; color: var(--eti-dark); }
    .fe-wrap { border:1px solid #d0d8e4;border-radius:10px;overflow:hidden;background:#fff }
    .fe-toolbar { display:flex;gap:2px;padding:5px 8px;background:#f5f7fa;border-bottom:1px solid #e2e8f0;flex-wrap:wrap }
    .fe-toolbar button { width:28px;height:26px;border:none;background:transparent;border-radius:4px;color:#4a5a6a;cursor:pointer;font-size:.78rem;display:flex;align-items:center;justify-content:center;transition:background .15s }
    .fe-toolbar button:hover { background:#e0e6ef }
    .fe-content { padding:10px 12px;min-height:60px;outline:none;font-size:.85rem;line-height:1.6 }
    .fe-content:empty::before { content:attr(data-placeholder);color:#b0bcc8;font-style:italic }
    .fe-content pre { background:#1e2a3a;color:#e4eaf0;padding:10px 14px;border-radius:6px;overflow-x:auto;font-size:.78rem;margin:6px 0 }
    .fe-content img { max-width:100%;border-radius:6px;margin:6px 0 }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><img src="img/ETI1.png" height="34" alt="ETI"> ETI Patagonia</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="javascript:void(0)" onclick="navigate('dashboard')"><i class="bi bi-collection me-1"></i>Contenidos</a></li>
        <li class="nav-item"><a class="nav-link" href="javascript:void(0)" onclick="navigate('foro')"><i class="bi bi-chat-dots me-1"></i>Foro</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" data-bs-toggle="dropdown"><i class="bi bi-person-circle me-1"></i><span id="userName">Usuario</span></a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="javascript:void(0)" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" id="appContainer"><div class="text-center py-5"><div class="spinner-border text-dark" role="status"></div><p class="mt-2 text-muted small">Cargando...</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://gsppzvpgdgapotsrrksk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzcHB6dnBnZGdhcG90c3Jya3NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNTE2OTksImV4cCI6MjA5ODkyNzY5OX0.R6BvlqytSNa33DfaI3k3uL4gdHmqxiZlrApzoaCRZgA';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let allContents = [];
let currentSection = 'inicio';

const SECTIONS = [
  { id: 'inicio', label: 'Inicio', icon: 'bi-house-door' },
  { id: 'aplicaciones', label: 'Aplicaciones', icon: 'bi-grid' },
  { id: 'proyectos', label: 'Proyectos', icon: 'bi-rocket-takeoff' },
  { id: 'arduino', label: 'Arduino', icon: 'bi-cpu' },
  { id: 'docentes', label: 'Docentes', icon: 'bi-mortarboard' },
  { id: 'uplc', label: 'uPLC', icon: 'bi-motherboard' },
  { id: 'foro', label: 'Foro', icon: 'bi-chat-dots' },
];
const SEC_LABEL = Object.fromEntries(SECTIONS.map(s => [s.id, s.label]));

// Expose functions to global scope for onclick
window.navigate = function(page) {
  if (window.location.hash !== '#' + page) {
    window.location.hash = page;
    // hashchange event will call renderRoute
  } else {
    renderRoute();
  }
};
window.filterSection = filterSection;
window.verPregunta = verPregunta;
window.nuevaPregunta = nuevaPregunta;
window.enviarPregunta = enviarPregunta;
window.responder = responder;
window.marcarResuelta = marcarResuelta;
window.logout = logout;
window.copiarCodigo = copiarCodigo;
window.togglePin = togglePin;
window.eliminar = eliminar;
window.eliminarPregunta = eliminarPregunta;

async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return false; }
  localStorage.setItem('sb_token', session.access_token);
  const { data: { user } } = await supabase.auth.getUser();
  currentUser = user;
  return true;
}

async function init() {
  const ok = await checkAuth();
  if (!ok) return;

  const name = currentUser?.user_metadata?.full_name || currentUser?.email?.split('@')[0] || 'Usuario';
  document.getElementById('userName').textContent = name;

  window.addEventListener('hashchange', renderRoute);
  renderRoute();
}

function renderRoute() {
  const hash = window.location.hash.slice(1) || 'dashboard';
  const [page, qs] = hash.split('?');
  if (page === 'dashboard') renderDashboard();
  else if (page === 'ver') renderContent(qs);
  else if (page === 'foro') renderForo();
  else renderDashboard();
}

// ── DASHBOARD ──
async function renderDashboard() {
  const container = document.getElementById('appContainer');
  container.innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
      <h4 class="page-title mb-0"><i class="bi bi-collection me-2"></i>Contenidos</h4>
      <div class="d-flex gap-2 flex-wrap">${SECTIONS.map(s => `<button class="section-nav-btn${s.id === currentSection ? ' active' : ''}" onclick="filterSection('${s.id}', this)"><i class="${s.icon}"></i>${s.label}</button>`).join('')}</div>
    </div>
    <div id="contentGrid"><div class="text-center py-5"><div class="spinner-border text-dark" role="status"></div></div></div>`;

  const { data, error } = await supabase.from('contents').select('*').eq('status', 'published').order('pinned', { ascending: false }).order('updated_at', { ascending: false });
  if (error) { document.getElementById('contentGrid').innerHTML = '<div class="alert alert-warning mt-3">Error: ' + error.message + '</div>'; return; }
  allContents = data || [];
  filterSection(currentSection, document.querySelector('.section-nav-btn.active') || document.querySelector('.section-nav-btn'));
}

function filterSection(section, btn) {
  if (section === 'foro') { navigate('foro'); return; }
  currentSection = section;
  document.querySelectorAll('.section-nav-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const isOwner = (c) => currentUser && c.user_id === currentUser.id;
  let filtered = section === 'inicio' ? allContents : allContents.filter(c => c.section === section);
  const grid = document.getElementById('contentGrid');
  if (!filtered.length) { grid.innerHTML = '<div class="empty-state"><i class="bi bi-inbox"></i>No hay contenido en esta sección.</div>'; return; }
  grid.innerHTML = `<div class="row g-3">${filtered.map(c => `
    <div class="col-md-6 col-lg-4">
      <div class="content-card" onclick="navigate('ver?id=${c.id}')">
        <div class="d-flex justify-content-between align-items-start">
          <div class="card-section">${SEC_LABEL[c.section] || c.section}${c.pinned ? ' <i class="bi bi-pin-fill" style="color:var(--eti-dark)"></i>' : ''}</div>
          <div class="d-flex gap-1">
            ${isOwner(c) ? `<button class="btn btn-sm p-0 border-0" style="color:#8a9aaa" onclick="event.stopPropagation();togglePin('${c.id}', ${c.pinned})" title="${c.pinned ? 'Desfijar' : 'Fijar'}"><i class="bi ${c.pinned ? 'bi-pin-fill' : 'bi-pin'}"></i></button>` : ''}
            ${isOwner(c) ? `<button class="btn btn-sm p-0 border-0" style="color:#dc3545" onclick="event.stopPropagation();eliminar('${c.id}')" title="Eliminar"><i class="bi bi-trash"></i></button>` : ''}
          </div>
        </div>
        <h5>${esc(c.title)}</h5>
        <p>${esc(c.excerpt || (c.content||'').replace(/<[^>]*>/g,'').slice(0,150)||'')}</p>
        <div class="card-meta d-flex justify-content-between">
          <span><i class="bi bi-person me-1"></i>${esc(c.author||'Anónimo')}</span>
          <span>${fecha(c.updated_at)}</span>
        </div>
        ${c.tags ? `<div class="card-tags mt-2">${c.tags.split(',').map(t => `<span class="badge bg-light text-dark me-1">${t.trim()}</span>`).join('')}</div>` : ''}
      </div>
    </div>`).join('')}</div>`;
}

// ── VIEWER ──
async function renderContent(qs) {
  const id = new URLSearchParams(qs||'').get('id');
  const container = document.getElementById('appContainer');
  if (!id) { navigate('dashboard'); return; }

  const { data, error } = await supabase.from('contents').select('*').eq('id', id).single();
  if (error || !data) { container.innerHTML = '<div class="alert alert-warning mt-3">Contenido no encontrado</div>'; return; }

  const c = data;
  container.innerHTML = `
    <a href="javascript:void(0)" onclick="navigate('dashboard')" class="text-decoration-none small mb-3 d-inline-block"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    <article>
      <div class="mb-1"><span class="badge bg-dark">${SEC_LABEL[c.section]||c.section}${c.pinned ? ' 📌' : ''}</span>${c.tags ? c.tags.split(',').map(t => `<span class="badge bg-secondary ms-1">${t.trim()}</span>`).join('') : ''}</div>
      <h2 class="fw-bold" style="color:var(--eti-dark)">${esc(c.title)}</h2>
      <p class="text-muted small mb-3"><i class="bi bi-person me-1"></i>${esc(c.author||'Anónimo')} · ${fecha(c.updated_at)}</p>
      <div class="viewer-content">${procesarContenido(c.content||'')}</div>
    </article>`;
}

// ── FORO ──
async function renderForo() {
  const container = document.getElementById('appContainer');
  container.innerHTML = `
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h4 class="page-title mb-0"><i class="bi bi-chat-dots me-2"></i>Foro</h4>
      <button class="btn btn-dark btn-sm" onclick="nuevaPregunta()"><i class="bi bi-plus-lg me-1"></i>Preguntar</button>
    </div>
    <div id="forumContent"><div class="text-center py-5"><div class="spinner-border text-dark" role="status"></div></div></div>`;

  // Fetch pinned announcements (contents with section='foro' and pinned=true)
  const { data: announcements } = await supabase
    .from('contents')
    .select('*')
    .eq('section', 'foro')
    .eq('pinned', true)
    .eq('status', 'published')
    .order('updated_at', { ascending: false });

  const { data: questions, error } = await supabase.from('questions').select('*').order('pinned', { ascending: false }).order('created_at', { ascending: false });
  if (error) { document.getElementById('forumContent').innerHTML = '<div class="alert alert-warning">Error</div>'; return; }
  const grid = document.getElementById('forumContent');
  if (!questions?.length && !announcements?.length) { grid.innerHTML = '<div class="empty-state"><i class="bi bi-chat-square-text"></i>No hay preguntas aún.</div>'; return; }

  // Get answer counts
  let counts = {};
  for (const q of questions || []) {
    const { count } = await supabase.from('answers').select('*', { count: 'exact', head: true }).eq('question_id', q.id);
    counts[q.id] = count || 0;
  }

  const isTeacher = currentUser?.email === 'prof.martintorres@educ.ar';

  let html = '';

  // Pinned announcements (from editor)
  if (announcements?.length) {
    for (const a of announcements) {
      html += `<div class="question-card" style="border-left:3px solid var(--eti-dark);background:#f5f7fa" onclick="verAnuncio('${a.id}')">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div class="q-title"><i class="bi bi-pin-fill me-1" style="color:var(--eti-dark)"></i>${esc(a.title)}</div>
            <div class="q-meta mt-1" style="font-size:.75rem;color:#8a9aaa"><i class="bi bi-person me-1"></i>${esc(a.author||'Admin')} · ${fecha(a.updated_at)} · <span class="badge bg-dark text-white">📌 Aviso</span></div>
          </div>
        </div>
      </div>`;
    }
  }

  // Regular questions
  html += (questions || []).map(q => `
    <div class="question-card" onclick="verPregunta('${q.id}')">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <div class="q-title">${esc(q.title)}</div>
          <div class="q-meta mt-1" style="font-size:.75rem;color:#8a9aaa"><i class="bi bi-person me-1"></i>${esc(q.author)} · ${fecha(q.created_at)} · <span class="badge bg-light text-dark">${SEC_LABEL[q.section]||q.section}</span> · ${counts[q.id]} respuestas</div>
        </div>
        <div class="d-flex align-items-center gap-2">
          ${q.pinned ? '<i class="bi bi-pin-fill" style="color:var(--eti-dark)" title="Fijada"></i>' : ''}
          ${q.resolved ? '<span class="badge-resolved"><i class="bi bi-check-circle me-1"></i>Resuelta</span>' : ''}
          ${isTeacher ? `<button class="btn btn-sm p-0 border-0" style="color:#8a9aaa" onclick="event.stopPropagation();togglePinPregunta('${q.id}', ${q.pinned})" title="${q.pinned ? 'Desfijar' : 'Fijar'}"><i class="bi ${q.pinned ? 'bi-pin-fill' : 'bi-pin'}"></i></button>` : ''}
          ${isTeacher ? `<button class="btn btn-sm p-0 border-0" style="color:#dc3545" onclick="event.stopPropagation();eliminarPregunta('${q.id}')" title="Eliminar"><i class="bi bi-trash"></i></button>` : ''}
        </div>
      </div>
    </div>
  `).join('');
  grid.innerHTML = html;
}

async function verPregunta(id) {
  const container = document.getElementById('appContainer');
  const { data: q, error } = await supabase.from('questions').select('*').eq('id', id).single();
  if (error || !q) { container.innerHTML = '<div class="alert alert-warning">No encontrada</div>'; return; }

  const { data: answers } = await supabase.from('answers').select('*').eq('question_id', id).order('created_at', { ascending: true });
  const isTeacher = currentUser?.email === 'prof.martintorres@educ.ar';

  container.innerHTML = `
    <a href="javascript:void(0)" onclick="navigate('foro')" class="text-decoration-none small mb-3 d-inline-block"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    <div class="card p-3 mb-3" style="border-radius:14px;border:1px solid #e6edf4">
      <div class="d-flex justify-content-between">
        <h5 class="fw-bold" style="color:var(--eti-dark)">${esc(q.title)}</h5>
        <div class="d-flex align-items-center gap-2">
          ${q.pinned ? '<span class="badge bg-dark text-white">📌 Fijada</span>' : ''}
          ${q.resolved ? '<span class="badge-resolved"><i class="bi bi-check-circle me-1"></i>Resuelta</span>' : ''}
          ${isTeacher ? `<button class="btn btn-sm border-0" style="color:#8a9aaa" onclick="togglePinPregunta('${q.id}', ${q.pinned})" title="${q.pinned ? 'Desfijar' : 'Fijar'}"><i class="bi ${q.pinned ? 'bi-pin-fill' : 'bi-pin'}"></i></button>` : ''}
          ${isTeacher ? `<button class="btn btn-sm border-0" style="color:#dc3545" onclick="eliminarPregunta('${q.id}')" title="Eliminar"><i class="bi bi-trash"></i></button>` : ''}
        </div>
      </div>
      <p class="text-muted small"><i class="bi bi-person me-1"></i>${esc(q.author)} · ${fecha(q.created_at)} · <span class="badge bg-light text-dark">${SEC_LABEL[q.section]||q.section}</span></p>
      <div class="viewer-content">${procesarContenido(q.content || '')}</div>
    </div>
    <h6 class="fw-bold mb-2">Respuestas (${answers?.length||0})</h6>
    <div id="answersContainer">
      ${!answers?.length ? '<p class="text-muted small">Sin respuestas aún.</p>' :
        answers.map(a => `<div class="answer-card">
          <div style="font-size:.75rem;color:#8a9aaa"><i class="bi bi-person me-1"></i>${esc(a.author)} · ${fecha(a.created_at)}</div>
          <div class="mt-1 viewer-content">${procesarContenido(a.content || '')}</div>
        </div>`).join('')}
    </div>
    <div class="mt-3">
      <textarea class="form-control" id="ansInput" rows="2" placeholder="Escribí tu respuesta..." style="border-radius:10px;font-size:.85rem;display:none"></textarea>
      <button class="btn btn-dark btn-sm mt-2" onclick="responder('${q.id}')"><i class="bi bi-reply me-1"></i>Responder</button>
      ${isTeacher && !q.resolved ? `<button class="btn btn-outline-success btn-sm mt-2 ms-2" onclick="marcarResuelta('${q.id}')"><i class="bi bi-check-circle me-1"></i>Marcar resuelta</button>` : ''}
    </div>`;
  setTimeout(() => makeRichEditor('ansInput'), 50);
}

async function verAnuncio(id) {
  const container = document.getElementById('appContainer');
  const { data: a, error } = await supabase.from('contents').select('*').eq('id', id).single();
  if (error || !a) { container.innerHTML = '<div class="alert alert-warning">No encontrado</div>'; return; }
  const isTeacher = currentUser?.email === 'prof.martintorres@educ.ar';
  container.innerHTML = `
    <a href="javascript:void(0)" onclick="navigate('foro')" class="text-decoration-none small mb-3 d-inline-block"><i class="bi bi-arrow-left me-1"></i>Volver al foro</a>
    <div class="card p-3 mb-3" style="border-radius:14px;border:1px solid #e6edf4;border-left:3px solid var(--eti-dark)">
      <div class="d-flex justify-content-between">
        <h5 class="fw-bold" style="color:var(--eti-dark)"><i class="bi bi-pin-fill me-1"></i>${esc(a.title)}</h5>
        <div>
          ${isTeacher ? `<button class="btn btn-sm border-0" style="color:#dc3545" onclick="if(confirm('¿Eliminar este aviso?')){eliminarAnuncio('${a.id}')}" title="Eliminar"><i class="bi bi-trash"></i></button>` : ''}
        </div>
      </div>
      <p class="text-muted small"><i class="bi bi-person me-1"></i>${esc(a.author||'Admin')} · ${fecha(a.updated_at)} · <span class="badge bg-dark text-white">📌 Aviso</span></p>
      <div class="viewer-content">${procesarContenido(a.content || '')}</div>
    </div>`;
}

async function eliminarAnuncio(id) {
  const { error } = await supabase.from('contents').update({ status: 'draft' }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  showToast('Aviso eliminado', 'success');
  navigate('foro');
}

async function marcarResuelta(id) {
  const { error } = await supabase.from('questions').update({ resolved: true }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  verPregunta(id);
}

function nuevaPregunta() {
  document.getElementById('appContainer').innerHTML = `
    <a href="javascript:void(0)" onclick="navigate('foro')" class="text-decoration-none small mb-3 d-inline-block"><i class="bi bi-arrow-left me-1"></i>Volver</a>
    <div class="card p-4" style="border-radius:14px;border:1px solid #e6edf4;max-width:700px">
      <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle me-2"></i>Nueva Pregunta</h5>
      <div class="mb-3"><label class="form-label small fw-semibold">Título</label><input type="text" class="form-control" id="qTitle"></div>
      <div class="mb-3"><label class="form-label small fw-semibold">Descripción</label><textarea class="form-control" id="qContent" rows="4" style="display:none"></textarea></div>
      <button class="btn btn-dark" onclick="enviarPregunta()"><i class="bi bi-send me-1"></i>Publicar</button>
    </div>`;
  setTimeout(() => makeRichEditor('qContent'), 50);

async function enviarPregunta() {
  const title = document.getElementById('qTitle').value.trim();
  const section = 'foro';
  const fe = document.getElementById('qContent_fe');
  const content = fe ? fe.innerHTML.trim() : document.getElementById('qContent').value.trim();
  if (!title) { alert('El título es obligatorio.'); return; }
  const name = currentUser?.user_metadata?.full_name || currentUser?.email?.split('@')[0] || 'Anónimo';
  const { error } = await supabase.from('questions').insert({ title, section, content, author: name, user_id: currentUser?.id });
  if (error) { alert('Error: ' + error.message); return; }
  showToast('Pregunta publicada en el foro', 'success');
  navigate('foro');
}

function logout() {
  localStorage.removeItem('sb_token');
  supabase.auth.signOut().then(() => { window.location.href = 'index.html'; });
}

function showToast(msg, type) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:10px;font-size:.85rem;font-weight:500;z-index:9999;transition:opacity .3s;background:' + (type === 'success' ? '#2d7d46' : '#dc3545') + ';color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15)';
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 300); }, 2500);
}

// ── UTILS ──
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fecha(d) { if (!d) return ''; return new Date(d).toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

function renderLatex(html) {
  if (!html || typeof katex === 'undefined') return html;
  html = html.replace(/\$\$([\s\S]*?)\$\$/g, (_, eq) => {
    try { return katex.renderToString(eq.trim(), { displayMode: true, throwOnError: false }); }
    catch { return '$$' + eq + '$$'; }
  });
  html = html.replace(/(?<!\$)\$(\S[^$\n]*?\S)\$(?!\$)/g, (_, eq) => {
    try { return katex.renderToString(eq.trim(), { displayMode: false, throwOnError: false }); }
    catch { return '$' + eq + '$'; }
  });
  return html;
}

function procesarContenido(html) {
  if (!html) return '';
  html = renderLatex(html);
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('pre').forEach(pre => {
    if (!pre.closest('.eti-code-block')) {
      const w = document.createElement('div'); w.className = 'eti-code-block';
      const h = document.createElement('div'); h.className = 'code-header';
      h.innerHTML = '<span>Código</span><button class="copy-btn" onclick="copiarCodigo(this)"><i class="bi bi-clipboard me-1"></i>Copiar</button>';
      pre.parentNode.insertBefore(w, pre); w.appendChild(h); w.appendChild(pre);
    }
  });
  return div.innerHTML;
}

function copiarCodigo(btn) {
  const pre = btn.closest('.eti-code-block').querySelector('pre');
  if (!pre) return;
  const text = pre.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>Copiado';
    setTimeout(() => btn.innerHTML = '<i class="bi bi-clipboard me-1"></i>Copiar', 2000);
  });
}

// ── Rich text editor for forum ──
function makeRichEditor(textareaId) {
  const ta = document.getElementById(textareaId);
  if (!ta) return null;
  const wrap = document.createElement('div');
  wrap.className = 'fe-wrap';
  const placeholder = ta.placeholder || 'Escribí...';
  const initial = ta.value || '';
  ta.style.display = 'none';
  ta.parentNode.insertBefore(wrap, ta);
  wrap.innerHTML = `<div class="fe-toolbar">
    <button onclick="feCmd('${textareaId}','bold')" title="Negrita"><b>B</b></button>
    <button onclick="feCmd('${textareaId}','italic')" title="Cursiva"><i>I</i></button>
    <button onclick="feCmd('${textareaId}','underline')" title="Subrayado"><u>U</u></button>
    <button onclick="feCmd('${textareaId}','insertUnorderedList')" title="Lista">•</button>
    <button onclick="feCmd('${textareaId}','insertOrderedList')" title="Lista num." style="font-weight:600">1.</button>
    <button onclick="feCmd('${textareaId}','formatBlock','pre')" title="Código">&lt;/&gt;</button>
    <button onclick="feLink('${textareaId}')" title="Link">🔗</button>
    <button onclick="feImage('${textareaId}')" title="Imagen">🖼</button>
    <button onclick="feVideo('${textareaId}')" title="Video YouTube">▶</button>
    <button onclick="feLatex('${textareaId}')" title="Fórmula LaTeX">∑</button>
  </div><div class="fe-content" id="${textareaId}_fe" contenteditable="true" data-placeholder="${placeholder}"></div>`;
  const fe = document.getElementById(textareaId + '_fe');
  fe.innerHTML = initial;
  fe.addEventListener('paste', e => {
    e.preventDefault();
    const html = e.clipboardData.getData('text/html');
    const text = e.clipboardData.getData('text/plain');
    if (html && html.includes('<') && /style|class|font|mso|<!--/.test(html)) {
      document.execCommand('insertHTML', false, cleanForumPaste(html));
    } else if (html && html.includes('<')) {
      document.execCommand('insertHTML', false, html);
    } else {
      document.execCommand('insertText', false, text);
    }
  });
  fe.addEventListener('input', () => { ta.value = fe.innerHTML; });
  ta.value = fe.innerHTML;
  return { wrap, fe, ta };
}
function feCmd(id, cmd, val) {
  const fe = document.getElementById(id + '_fe');
  if (!fe) return;
  fe.focus();
  if (cmd === 'formatBlock' && val === 'pre') {
    document.execCommand('insertHTML', false, '<pre><code> </code></pre>');
  } else {
    document.execCommand(cmd, false, val || null);
  }
  fe.focus();
  document.getElementById(id).value = fe.innerHTML;
}
function feLink(id) {
  const url = prompt('URL del link:');
  if (!url) return;
  document.execCommand('createLink', false, url);
  document.getElementById(id).value = document.getElementById(id + '_fe').innerHTML;
}
function feLatex(id) {
  const eq = prompt('Fórmula LaTeX (ej: E = mc^2):');
  if (!eq) return;
  document.execCommand('insertHTML', false, '$$' + eq + '$$');
  document.getElementById(id).value = document.getElementById(id + '_fe').innerHTML;
}
function feImage(id) {
  const url = prompt('URL de la imagen (directa, ej: https://ejemplo.com/foto.jpg):');
  if (!url) return;
  document.execCommand('insertHTML', false, '<img src="' + url.replace(/"/g,'&quot;') + '" alt="Imagen" style="max-width:100%;border-radius:6px">');
  document.getElementById(id).value = document.getElementById(id + '_fe').innerHTML;
}
function feVideo(id) {
  const url = prompt('URL del video de YouTube:');
  if (!url) return;
  const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (!match) { alert('URL de YouTube no válida'); return; }
  const vid = match[1];
  document.execCommand('insertHTML', false, '<div class="eti-video-wrap"><iframe src="https://www.youtube.com/embed/' + vid + '" allowfullscreen></iframe></div>');
  document.getElementById(id).value = document.getElementById(id + '_fe').innerHTML;
}
function cleanForumPaste(html) {
  return html.replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<svg[\s\S]*?<\/svg>/gi, '')
    .replace(/<style[\s\S]*?<\/style>/gi, '')
    .replace(/<(meta|link|style|script|object|iframe)[^>]*>/gi, '')
    .replace(/<\/?(html|head|body|meta|link|style|script|object|iframe)[^>]*>/gi, '');
}

init();
